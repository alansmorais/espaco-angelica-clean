name: Authorized admin preview

on:
  push:
    branches:
      - feature/google-calendar-sync-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: isolated-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate preview remains independent from production services
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies?.firebase || p.dependencies?.express || p.dependencies?.dotenv) process.exit(1); console.log('Static preview dependency check passed')"
      - name: Run preview safety, catalog, and Calendar sync preservation tests
        run: node --test tests/unit/preview-safety-and-sync.test.mjs tests/unit/recurrence-and-catalog.test.mjs
      - name: Run live read-only catalog integration test (getServices)
        run: npm run test:integration
      - name: Build authorized admin preview
        run: npm run build
      - name: Verify built dist artifact
        run: |
          node -e "const fs=require('fs'); if (!fs.existsSync('dist/index.html')) process.exit(1); const assets=fs.readdirSync('dist/assets'); if (!assets.some(f=>f.endsWith('.js'))) process.exit(1); console.log('Verified dist/index.html and JS bundle:', assets.join(', '));"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
